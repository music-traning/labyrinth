  <style>
    /* フォント読み込み */
    @import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Rajdhani:wght@300;500;700&display=swap');

    /* --- Reset & Base --- */
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
      /* タップ時のハイライトを無効化 */
    }

    body {
      margin: 0;
      padding: 0;
      overflow: hidden;
      /* 背景色: 画像読み込み前の一瞬のチラつきを防ぐため黒を指定 */
      background-color: #0a0a1a;
      background: linear-gradient(135deg, #0a0a1a 0%, #1a0a2e 50%, #0a0a1a 100%);
      font-family: 'Rajdhani', 'Orbitron', monospace;
      position: relative;
    }

    /* --- App Container --- */
    #app {
      position: relative;
      z-index: 1;
      width: 100vw;
      height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    /* --- Phaser Canvas (Game Screen) --- */
    canvas {
      display: block;
      margin: 0 auto;
      border: 2px solid rgba(0, 255, 255, 0.5);
      /* パフォーマンス最適化: スマホ負荷軽減のためシャドウを軽量化 */
      box-shadow:
        0 0 10px rgba(0, 255, 255, 0.2),
        inset 0 0 20px rgba(0, 0, 0, 0.5);
      border-radius: 4px;
      max-width: 100%;
      max-height: 100%;
      object-fit: contain;
    }

    /* --- Loading Screen (LCP対策) --- */
    #loading-screen {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background-color: #000;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      z-index: 9999;
      /* 最前面 */
      transition: opacity 0.5s ease;
      will-change: opacity;
      /* 最適化 */
    }

    .loader-text {
      color: #00ffff;
      font-family: 'Orbitron', monospace;
      font-size: 24px;
      margin-top: 20px;
      letter-spacing: 2px;
      animation: blink 1s infinite;
    }

    .spinner {
      width: 50px;
      height: 50px;
      border: 3px solid rgba(0, 255, 255, 0.3);
      border-radius: 50%;
      border-top-color: #00ffff;
      animation: spin 1s ease-in-out infinite;
      will-change: transform;
      /* 最適化 */
    }

    @keyframes spin {
      to {
        transform: rotate(360deg);
      }
    }

    @keyframes blink {
      50% {
        opacity: 0.5;
      }
    }

    /* --- Background Effects (Cyberpunk Visuals) --- */
    /* グリッド背景 */
    body::before {
      content: '';
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background-image:
        linear-gradient(rgba(0, 255, 255, 0.03) 1px, transparent 1px),
        linear-gradient(90deg, rgba(0, 255, 255, 0.03) 1px, transparent 1px);
      background-size: 50px 50px;
      pointer-events: none;
      z-index: 0;
    }

    /* ネオングロー (GPU最適化済み) */
    body::after {
      content: '';
      position: fixed;
      top: -50%;
      left: -50%;
      width: 200%;
      height: 200%;
      background: radial-gradient(circle, rgba(255, 0, 255, 0.1) 0%, transparent 70%);
      animation: pulse 8s ease-in-out infinite;
      pointer-events: none;
      z-index: 0;
      will-change: transform, opacity;
      transform: translateZ(0);
    }

    @keyframes pulse {

      0%,
      100% {
        opacity: 0.3;
        transform: scale(1);
      }

      50% {
        opacity: 0.6;
        transform: scale(1.1);
      }
    }

    /* スキャンライン (GPU最適化済み) */
    .scanline {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 2px;
      background: linear-gradient(transparent, rgba(0, 255, 255, 0.3), transparent);
      animation: scanline 8s linear infinite;
      pointer-events: none;
      z-index: 999;
      will-change: transform;
      transform: translateZ(0);
    }

    @keyframes scanline {
      0% {
        transform: translateY(-100%);
      }

      100% {
        transform: translateY(100vh);
      }
    }
  </style>
</head>

<body>
  <div id="loading-screen">
    <div class="spinner"></div>
    <div class="loader-text">CONNECTING...</div>
  </div>

  <div class="scanline"></div>

  <div id="app"></div>
  <main id="app"></main>

  <script type="module" src="/src/main.ts"></script>
  <script>
    // 【保険】もしゲーム側でロード画面が消されなかった場合、4秒後に強制的に消す
    window.addEventListener('load', () => {
      setTimeout(() => {
        const loader = document.getElementById('loading-screen');
        if (loader) {
          loader.style.opacity = '0';
          setTimeout(() => loader.remove(), 500);
        }
      }, 4000); // 4秒待機
    });
  </script>
</body>
